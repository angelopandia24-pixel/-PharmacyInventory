services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: farmacia_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Pharmacy2026!Secret
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
volumes:
  sqlserver_data: